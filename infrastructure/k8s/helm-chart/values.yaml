api:
  image:
    repository: sentinel/api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8000
  env:
    DATABASE_URL: postgresql+psycopg2://sentinel@postgres:5432/sentinel
    REDIS_URL: redis://redis:6379/0
    LLM_PROVIDER: mock
    LLM_MOCK_ENABLED: "false"
    THREAT_INTEL_PROVIDER: mock
    DEMO_MODE: "true"
    MAX_UPLOAD_SIZE: "10485760"

web:
  image:
    repository: sentinel/web
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3000
  env:
    NEXT_PUBLIC_API_URL: http://api:8000

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
  persistence:
    size: 10Gi
  env:
    POSTGRES_USER: sentinel
    POSTGRES_DB: sentinel
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    POSTGRES_PASSWORD: null

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  persistence:
    size: 1Gi
